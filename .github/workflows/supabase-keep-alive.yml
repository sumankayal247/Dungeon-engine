name: Keep Supabase Project Alive

on:
  schedule:
    # Runs every day at 12:00 UTC
    - cron: '0 12 * * *'

  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            "${SUPABASE_URL}/rest/v1/rpc/keep_alive" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json")

          echo "Supabase response: $response"

          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "Supabase keep-alive failed"
            exit 1
          fi

          echo "Supabase is alive"

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
